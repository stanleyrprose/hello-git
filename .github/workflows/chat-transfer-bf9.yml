name: Chat Transfer BF9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        run: curl -L --fail --retry 3 'https://chatfile-0928.stanleyxyz.com/instrumental.mp3?v=bf9dc6e3b202-1759' -o audio_bf9dc6e3b202_instrumental.mp3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-bf9-instrumental
          path: audio_bf9dc6e3b202_instrumental.mp3
          retention-days: 1
